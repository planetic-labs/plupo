name: Retry release runner failures

on:
  workflow_run:
    workflows: ['Build and release Plupo']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Release workflow run ID to inspect'
        required: true
        type: string
      dry_run:
        description: 'Inspect only, without restarting'
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: retry-release-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      checks: read
    steps:
      - name: Check out trusted default-branch automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run uses the default-branch SHA, never the triggering tag's code.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retry only a confirmed runner capacity failure
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=()
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          python3 scripts/retry-runner-failure.py "$RUN_ID" "${args[@]}"
