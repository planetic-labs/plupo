name: Monthly Swift security scan

on:
  schedule:
    # First day of each month at 11:17 Europe/Moscow (08:17 UTC).
    - cron: '17 8 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-swift-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze Swift with CodeQL
    # CodeQL currently uses Rosetta on Apple Silicon. Analyze on Intel,
    # while cross-compiling the same universal application sources.
    runs-on: macos-15-intel
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended
      - name: Build for analysis
        run: |
          xcodebuild -project Plupo.xcodeproj -scheme Plupo \
            -configuration Debug -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/PlupoCodeQL" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            clean build
      - name: Publish security analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:swift
