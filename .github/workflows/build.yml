name: Build and release Plupo

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to publish (leave empty for build only)'
        type: string
        default: ''
      artifact_run_id:
        description: 'Successful build run to reuse for publication'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: plupo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build Universal DMG
    if: github.event_name != 'workflow_dispatch' || inputs.release_tag == ''
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - name: Build and package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          version=0.0.0
          if [[ "$IS_TAG" == true ]]; then
            version="${RELEASE_TAG#v}"
          fi
          bash scripts/package-dmg.sh "$version"
      - name: Save DMG and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Plupo-universal
          path: |
            build/distribution/Plupo-universal.dmg
            build/distribution/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: always() && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.artifact_run_id != ''))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download packaged app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Plupo-universal
          path: distribution
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Publish DMG
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          SOURCE_RUN_ID: ${{ inputs.artifact_run_id || github.run_id }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag'; exit 1; }
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Invalid build run'; exit 1; }
          expected_commit=$(git rev-parse "$RELEASE_TAG^{commit}")
          built_commit=$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" --jq .head_sha)
          [[ "$expected_commit" == "$built_commit" ]] || { echo 'Build does not match release tag'; exit 1; }
          (cd distribution && sha256sum -c SHA256SUMS.txt)
          cat > release-notes.md <<'NOTES'
          ## Plupo for Apple Silicon and Intel

          Download **Plupo-universal.dmg**, open it, and drag Plupo into Applications.
          Requires **macOS 14.0 or later** and a **Mac with Apple Silicon or Intel**.

          See the README for known limitations.

          ### First launch

          This build uses an ad-hoc signature. It has **no Apple Developer ID signature** and is **not notarized by Apple**. macOS may block it on first launch.

          If you trust this download, try opening the installed app once, then use **System Settings → Privacy & Security → Open Anyway** and confirm. Do not disable system-wide security protections.

          [Apple's explanation of opening apps from unidentified developers](https://support.apple.com/102445).

          The DMG and its SHA-256 checksum are built automatically on GitHub. No Apple account or personal signing certificate is used.
          NOTES
          gh release create "$RELEASE_TAG" \
            distribution/Plupo-universal.dmg distribution/SHA256SUMS.txt \
            --verify-tag --title "Plupo $RELEASE_TAG" \
            --generate-notes --notes-file release-notes.md --latest
